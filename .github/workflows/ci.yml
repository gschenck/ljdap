name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Interpreter installieren
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1
      - name: Unit-Tests (luajit, lua5.1)
        run: sh tests/run.sh luajit lua5.1
  # Ab M1: Szenarien mit tests/dap_client.py, Prüfung „ljdap.lua aktuell“
  # (tools/amalgamate.lua), Windows-Teil mit luajit.exe unter Wine.
