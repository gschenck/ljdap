name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # LuaJIT-Stand für den Windows-Build (v2.1, 2026-10-21)
  LUAJIT_COMMIT: a4c064539ea931274d407e1249b4bb575424a0f4

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Interpreter installieren
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua-socket
      - name: Ein-Datei-Version ljdap.lua aktuell?
        run: luajit tools/amalgamate.lua --check
      - name: Unit-Tests (luajit, lua5.1)
        run: sh tests/run.sh luajit lua5.1
      - name: Szenarien (luajit, lua5.1)
        run: python3 -m unittest discover -s tests/scenarios -v
      - name: Szenarien gegen die Ein-Datei-Version
        env:
          LJDAP_SINGLE: "1"
        run: python3 -m unittest discover -s tests/scenarios -v
      - name: Sublime-Plugin (inkl. API-Prüfung gegen aktuelles Debugger-Paket)
        run: |
          git clone -q --depth 1 https://github.com/daveleroy/SublimeDebugger.git /tmp/SublimeDebugger
          SUBLIME_DEBUGGER_SRC=/tmp/SublimeDebugger python3 -m unittest discover -s tests/editors -v

  luajit-exe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: MinGW installieren
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: luajit.exe bauen (statisch, x64)
        run: |
          git clone -q -b v2.1 https://github.com/LuaJIT/LuaJIT.git
          cd LuaJIT && git checkout -q "$LUAJIT_COMMIT"
          make -j4 HOST_CC=gcc CROSS=x86_64-w64-mingw32- TARGET_SYS=Windows BUILDMODE=static
      - uses: actions/upload-artifact@v4
        with:
          name: luajit-exe
          path: LuaJIT/src/luajit.exe

  wine:
    needs: luajit-exe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luajit-exe
          path: bin
      - name: Wine installieren
        run: sudo apt-get update && sudo apt-get install -y wine64 wine
      - name: Unit-Tests unter Wine
        env:
          WINEDEBUG: -all
        run: |
          for t in tests/unit/*_test.lua; do wine bin/luajit.exe "$t" || exit 1; done
      - name: Szenarien unter Wine
        env:
          WINEDEBUG: -all
          LJDAP_INTERPS: wine bin/luajit.exe
        run: python3 -m unittest discover -s tests/scenarios -v

  windows:
    needs: luajit-exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luajit-exe
          path: bin
      - name: Unit-Tests
        shell: bash
        run: |
          for t in tests/unit/*_test.lua; do bin/luajit.exe "$t" || exit 1; done
      - name: Szenarien
        shell: bash
        env:
          LJDAP_INTERPS: bin/luajit.exe
        run: python -m unittest discover -s tests/scenarios -v

  sublime:
    # Ende-zu-Ende mit echtem Sublime Text (ohne Bildschirm) und Paket Debugger
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Interpreter und Xvfb installieren
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua-socket xvfb imagemagick zip
      - name: Sublime Text installieren (apt-Repository von sublimetext.com)
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO - https://download.sublimetext.com/sublimehq-pub.gpg | sudo tee /etc/apt/keyrings/sublimehq-pub.asc > /dev/null
          echo -e 'Types: deb\nURIs: https://download.sublimetext.com/\nSuites: apt/stable/\nSigned-By: /etc/apt/keyrings/sublimehq-pub.asc' | sudo tee /etc/apt/sources.list.d/sublime-text.sources
          sudo apt-get update && sudo apt-get install -y sublime-text
          /opt/sublime_text/sublime_text --version
      - name: Paket Debugger holen
        run: git clone -q --depth 1 https://github.com/daveleroy/SublimeDebugger.git /tmp/SublimeDebugger
      - name: Release-Dateien bauen (getestet wird das gebaute Paket)
        run: sh tools/build_release.sh
      - name: Ende-zu-Ende-Test
        env:
          LJDAP_E2E_PACKAGE: ${{ github.workspace }}/dist/ljdap.sublime-package
          SUBLIME_TEXT: /opt/sublime_text/sublime_text
          SUBLIME_DEBUGGER_SRC: /tmp/SublimeDebugger
          LJDAP_E2E_OUT: ${{ github.workspace }}/e2e-out
        run: python3 tests/editors/e2e_sublime.py luajit lua5.1
      - name: Fehler als Annotationen melden (über die API lesbar)
        if: failure()
        run: python3 tests/editors/annotate.py e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sublime-e2e
          path: e2e-out
          retention-days: 14

  vscode:
    # Erweiterung: Node-Tests (nachgebildetes vscode-Modul) und Ende-zu-Ende
    # mit echtem VS Code (@vscode/test-electron, ohne Bildschirm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interpreter und Xvfb installieren
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua-socket xvfb zip libasound2t64 libgbm1 libgtk-3-0 libnss3 libxss1
      - name: Node-Tests (luajit, lua5.1)
        working-directory: editors/vscode
        run: |
          for L in luajit lua5.1; do
            LJDAP_TEST_LUA=$L npm test > node-$L.log 2>&1 && continue
            cat node-$L.log
            # Logs sind über die API nicht lesbar: Fehlerstellen als Annotation
            msg=$(grep -n -A25 '^not ok\|^ *not ok' node-$L.log | head -n 60 | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Node-Tests $L::$msg"
            exit 1
          done
      - name: Ende-zu-Ende mit VS Code
        working-directory: editors/vscode
        run: |
          cp ../../ljdap.lua .
          npm install --no-save --no-package-lock @vscode/test-electron@2
          for L in luajit lua5.1; do
            LJDAP_TEST_LUA=$L xvfb-run -a node test/e2e/run.js 2>&1 | tee e2e-$L.log
            test "${PIPESTATUS[0]}" -eq 0 || { echo "::error title=VS-Code-E2E $L::$(grep -v '^\s*$' e2e-$L.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
          done
      - name: .vsix bauen
        run: VSCE="npx --yes @vscode/vsce@3" sh tools/build_release.sh && ls -l dist
